# Local services for Apex Garage (playbook instruction 3): PostgreSQL and Redis, plus placeholders
# for the API and web apps. How to use it: infra/README.md. Trade-offs: docs/DECISIONS.md.
#
#   cp .env.example .env && chmod 600 .env   # then set POSTGRES_PASSWORD and REDIS_PASSWORD
#   docker compose up -d --wait              # starts postgres and redis only, waits until healthy
#   docker compose ps                        # both show "(healthy)"
#
# Ports are published on 127.0.0.1 only, so other machines cannot reach these services. On Linux
# that needs Docker Engine 28 or later: older engines let machines on the same network reach them.

name: apex-garage

services:
  postgres:
    # PostgreSQL 18.6 with pgvector 0.8.7 (needed by instruction 77) on Debian 13 "trixie". The
    # digest pins this exact multi-platform build: always change the tag and the digest together.
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    restart: unless-stopped
    environment:
      # The image creates this superuser and database only when the data volume is empty.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-apex_garage}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      # PostgreSQL 18+ images keep the data in /var/lib/postgresql/18/docker and refuse to start
      # with a volume at the old /var/lib/postgresql/data path.
      - postgres-data:/var/lib/postgresql
    # Docker's default /dev/shm (64 MB) is too small for large parallel queries and parallel
    # pgvector index builds; the image's documentation suggests 256 MB. It is an upper limit, not
    # memory set aside.
    shm_size: 256mb
    healthcheck:
      # Over TCP on purpose: while the image initialises an empty volume, its temporary server
      # listens only on a Unix socket, so this check passes only once the real server is up.
      test:
        - CMD-SHELL
        - pg_isready --host=127.0.0.1 --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    # Docker's default log driver never rotates its files; "local" keeps at most 100 MB.
    logging:
      driver: local

  redis:
    # Redis 8.10.2 on Alpine 3.23 (licence notes in docs/DECISIONS.md). The digest pins this exact
    # multi-platform build: always change the tag and the digest together.
    image: redis:8.10.2-alpine3.23@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    # Redis reads its settings, the password among them, from the redis-config file (see configs
    # at the end). Keep redis-server as the first word: the image drops root privileges only when
    # it starts redis-server. Add nothing after the file: Redis applies later arguments on top.
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    configs:
      - source: redis-config
        target: /usr/local/etc/redis/redis.conf
    environment:
      # redis-cli reads its password from this variable, so `docker compose exec redis redis-cli`
      # needs no password on its command line. Keep it: Compose recreates the container when its
      # settings change, and this one changes with the password, while a change in the config
      # file's content alone goes unnoticed, so without it `docker compose up -d` would keep the
      # old password.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set it in .env (see .env.example)}
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      # The image declares no volume: without this one the data would go with the container.
      - redis-data:/data
    healthcheck:
      # The check reads the password from the file that redis-server read, so it always uses the
      # password Redis has: the container's REDISCLI_AUTH keeps the old one when
      # `docker compose start` writes a new password into the file. It hands the password to
      # redis-cli in REDISCLI_AUTH, never on a command line. -e makes redis-cli exit with an error
      # when Redis replies with one, such as WRONGPASS for a wrong password or LOADING while the
      # data is read back after a restart; without -e both would count as healthy.
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(sed -n 's/^requirepass //p' /usr/local/etc/redis/redis.conf)"
          redis-cli -e ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
    logging:
      driver: local

  # Placeholders for the apps, in the "app" profile so that a plain `docker compose up` skips them.
  # Neither app has a container image yet: run both on the host with `pnpm dev`. With the profile
  # (`docker compose --profile app up`), each placeholder prints that reminder and exits with
  # status 1 once the services it depends on are up. Remove them with the profile too
  # (`docker compose --profile app down`): a plain `docker compose down` leaves them behind.
  api:
    profiles: [app]
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    command:
      - sh
      - -c
      - 'echo "Placeholder: the API has no image yet. Run it on the host: pnpm dev" >&2; exit 1'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  web:
    profiles: [app]
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    command:
      - sh
      - -c
      - 'echo "Placeholder: the web app has no image yet. Run it on the host: pnpm dev" >&2; exit 1'
    depends_on:
      # Becomes service_healthy once the API image has a health check (endpoints: instruction 33).
      api:
        condition: service_started
    restart: "no"

volumes:
  postgres-data:
  redis-data:

configs:
  # Redis's settings. Compose copies this file into the redis container (mode 0444) when it starts
  # the container, and the file stays there across restarts. The password goes here, not on the
  # command line: on a Linux host every user can read any process's command line, and the image's
  # entrypoint runs with the full command line each time the container starts.
  redis-config:
    # requirepass: the image turns Redis's protected mode off, so without a password any client
    # that can reach the port gets in. appendonly: also log every write to a file, synced once a
    # second; Redis's default snapshots alone can lose up to an hour of writes (queued jobs,
    # sessions) in a crash.
    content: |
      requirepass ${REDIS_PASSWORD:?set it in .env (see .env.example)}
      appendonly yes
